[package]
name = "cargo-kill-all"
version = "0.6.0"
edition = "2021"
authors = ["manishsingh10895 <manishsingh10895@gmail.com>"]
description = "Reclaim disk space from build/cache directories across cargo, npm, and Flutter projects, in one pass"
readme = "README.md"
repository = "https://github.com/manishsingh10895/cargo-kill"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytefmt = "0.1.7"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossbeam-channel = "0.5.17"
num_cpus = "1.17.0"
remove_dir_all = "1.0.0"
spinners = "4.2.0"
inquire = "0.9.4"
serde_json = "1"
